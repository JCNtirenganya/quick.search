<!-- Chat panel for the Hub's Bootstrap modal (#rsdiChatModal). Host next to chat-core.js; set BASE below. -->
<div id="rsdiChatPanel"></div>
<script>
(function () {
  var BASE = "https://jcntirenganya.github.io/quick.search/";   /* where the .js files are hosted */
  function go() { RSDI_CHAT.mount(document.getElementById("rsdiChatPanel"), { modal: true, backend: "" /* your chat backend URL */ }); }
  if (window.RSDI_CHAT) return go();
  var s = document.createElement("script"); s.src = BASE + "chat-core.js"; s.onload = go; document.head.appendChild(s);
})();
</script>
