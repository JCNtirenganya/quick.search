<!-- UPI panel for the Hub's Bootstrap modal (#rsdiUpiModal). Host next to upi-core.js; set BASE below. -->
<div id="upiPanel"></div>
<script>
(function () {
  var BASE = "https://YOUR-USER.github.io/YOUR-REPO/";   /* where the .js files are hosted */
  function go() { RSDI_UPI.mount(document.getElementById("upiPanel"), { modal: true }); }
  if (window.RSDI_UPI) return go();
  var s = document.createElement("script"); s.src = BASE + "upi-core.js"; s.onload = go; document.head.appendChild(s);
})();
</script>
