<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Land use by UPI</title>
<style>
  :root { --accent:#0f6b5e; --accent-d:#0a4f45; }
  * { box-sizing:border-box; }
  body { margin:0; background:transparent; }
  .wrap { position:fixed; right:12px; bottom:12px; z-index:11; }
  #open { width:58px; height:58px; padding:0; border:0; border-radius:50%; cursor:pointer; background:var(--accent); color:#fff;
    display:flex; align-items:center; justify-content:center; box-shadow:0 6px 18px rgba(15,107,94,.35); }
  #open:hover { background:var(--accent-d); }
  #open:focus-visible { outline:3px solid var(--accent-d); outline-offset:2px; }
  #open svg { width:26px; height:26px; fill:currentColor; }
  #overlay { position:fixed; inset:0; z-index:10; display:flex; align-items:flex-end; justify-content:flex-end; padding:12px 12px 82px; }
  #overlay[hidden] { display:none; }
  /* Full-page mode (?open=1): no launcher, panel open at the top and centred, no close button */
  .page .wrap { display:none; }
  .page #overlay { align-items:flex-start; justify-content:center; padding:12px; }
  /* Embedded mode (?embed=1, e.g. ArcGIS Hub): the host page's CSS grows/shrinks this frame;
     show the launcher when it is small, the panel once it is large. */
  .embed #overlay { align-items:flex-end; justify-content:flex-end; padding:10px; }
  .embed .upi-close { display:none; }
</style>
</head>
<body>
<div class="wrap">
  <button id="open" aria-haspopup="dialog" aria-label="Check land use by UPI" title="Check land use by UPI">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
  </button>
</div>
<div id="overlay" hidden><div id="mount" role="dialog" aria-modal="true" aria-label="Land use by UPI"></div></div>
<script src="upi-core.js"></script>
<script>
var overlay = document.getElementById("overlay"), openBtn = document.getElementById("open"), wrap = document.querySelector(".wrap");
var params = new URLSearchParams(location.search);
var pageMode = params.get("open") === "1";
var embedMode = params.get("embed") === "1";
var upi = RSDI_UPI.mount(document.getElementById("mount"), { onClose: closeDlg, deferWarm: true });
function openDlg() { overlay.hidden = false; upi.warm(); upi.focus(); }
function closeDlg() { overlay.hidden = true; openBtn.focus(); }
openBtn.onclick = openDlg;
overlay.addEventListener("mousedown", function (e) { if (e.target === overlay && !pageMode && !embedMode) closeDlg(); });
document.addEventListener("keydown", function (e) { if (e.key === "Escape" && !overlay.hidden && !pageMode && !embedMode) closeDlg(); });
// Embedded mode: the host CSS changes this frame's size, so react to it.
function syncSize() {
  if (!embedMode) return;
  var open = window.innerWidth >= 240 && window.innerHeight >= 240;
  overlay.hidden = !open;
  wrap.style.display = open ? "none" : "";
  if (open) upi.warm();
}
// When the host page shrinks this frame to just the icon, tuck the panel away
window.addEventListener("resize", function () {
  if (embedMode) { syncSize(); return; }
  if (!pageMode && window.innerWidth < 200) overlay.hidden = true;
});
if (pageMode) { document.body.classList.add("page"); document.querySelector(".upi-close").style.display = "none"; openDlg(); }
if (embedMode) { document.body.classList.add("embed"); syncSize(); }
</script>
</body>
</html>
