<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rwanda SDI Hub chat</title>
<style>
  :root { --c-main:#0b4f8a; --c-main-d:#083c69; --c-accent:#f2b705; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:transparent; font:14px/1.4 system-ui, "Segoe UI", sans-serif; }
  #launch { position:absolute; right:9px; bottom:9px; width:58px; height:58px; border:0; border-radius:50%; cursor:pointer;
    background:var(--c-main); color:#fff; display:flex; align-items:center; justify-content:center; box-shadow:0 6px 18px rgba(11,79,138,.4); }
  #launch:hover { background:var(--c-main-d); }
  #launch svg { width:26px; height:26px; fill:currentColor; }
  #launch:focus-visible { outline:3px solid var(--c-accent); outline-offset:2px; }
  #panel { position:absolute; inset:10px; display:none; }
  body.open #panel { display:block; }
  body.open #launch { display:none; }
</style>
</head>
<body>
<button id="launch" aria-label="Open chat" title="Chat with Rwanda SDI Hub">
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 3h16a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H9l-5 4v-4H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/></svg>
</button>
<div id="panel" role="dialog" aria-label="Rwanda SDI Hub chat"></div>
<script src="chat-core.js"></script>
<script>
var BACKEND = "";   /* your chat backend URL */
var chat = RSDI_CHAT.mount(document.getElementById("panel"), { backend: BACKEND, fill: true, onClose: function () { setOpen(false); } });
function tell(open) { try { parent.postMessage({ type: "rsdi-chat", open: open }, "*"); } catch (e) {} }
function setOpen(open) {
  document.body.classList.toggle("open", open);
  tell(open);
  if (open) chat.focus(); else document.getElementById("launch").focus();
}
document.getElementById("launch").onclick = function () { setOpen(true); };
document.addEventListener("keydown", function (e) { if (e.key === "Escape" && document.body.classList.contains("open")) setOpen(false); });
if (new URLSearchParams(location.search).get("open") === "1") setOpen(true);
// When the host page shrinks this frame back to just the icon, tuck the panel away (the conversation stays)
window.addEventListener("resize", function () {
  if (window.innerWidth < 200 && document.body.classList.contains("open")) { document.body.classList.remove("open"); tell(false); }
});
</script>
</body>
</html>
