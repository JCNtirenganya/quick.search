# Checks the Rwanda SDI Hub widgets and publishes them to GitHub Pages.
# One-time setup: repo Settings > Pages > Build and deployment > Source = "GitHub Actions".
name: Check and deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check that every script parses
        run: |
          for f in *.js; do node --check "$f"; done
          for f in *.html; do
            node -e "const fs=require('fs');const h=fs.readFileSync(process.argv[1],'utf8');fs.writeFileSync('/tmp/inline.js',[...h.matchAll(/<script>([\s\S]*?)<\/script>/g)].map(m=>m[1]).join('\n'))" "$f"
            node --check /tmp/inline.js
          done

      - name: Warn about unfinished setup
        run: |
          if grep -l "YOUR-USER" upi-panel.html chat-panel.html; then
            echo "::warning::BASE in upi-panel.html / chat-panel.html still says YOUR-USER/YOUR-REPO. The modal versions will not load until it is set."
          fi
          if grep -q 'integrity: ""' upi-core.js; then
            echo "::warning::TURF.integrity in upi-core.js is empty, so the Turf script is loaded without an integrity check."
          fi

  deploy:
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Collect the files to publish
        run: |
          mkdir _site
          cp *.html *.js _site/
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
